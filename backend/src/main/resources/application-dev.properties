# Shoply Backend — Development Profile
# Activated by SPRING_PROFILES_ACTIVE=dev
# Similar to local but for shared dev environments

# Datasource (MySQL 8) — credentials from environment variables with dev defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shoply_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:shoply_app}
spring.datasource.password=${DB_PASSWORD:shoply_app_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.user=${FLYWAY_USER:shoply_migrator}
spring.flyway.password=${FLYWAY_PASSWORD:shoply_migrator_dev}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Logging
logging.level.root=INFO
logging.level.com.shoply=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Dev tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Payment provider (mock for dev)
shoply.payment.provider=mock

# CORS
shoply.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176

# Upload directory
shoply.upload.dir=./uploads

# Cookie security (HTTP in dev)
shoply.cookie.secure=false
