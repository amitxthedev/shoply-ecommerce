# Shoply Backend — Application Configuration

# Server
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Spring Profiles
spring.profiles.default=local

# Datasource (MySQL 8) — credentials from environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shoply_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:shoply_app}
spring.datasource.password=${DB_PASSWORD:shoply_app_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.user=${FLYWAY_USER:shoply_migrator}
spring.flyway.password=${FLYWAY_PASSWORD:shoply_migrator_dev}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.root=INFO
logging.level.com.shoply=DEBUG
