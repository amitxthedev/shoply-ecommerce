# Shoply Backend — Production Profile
# Activated by SPRING_PROFILES_ACTIVE=prod
# All secrets MUST come from environment variables — no defaults for credentials.

# Datasource (MySQL 8) — NO defaults for credentials
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — validate only, never auto-create or update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway — migrator credentials from env
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Logging — minimal, no SQL
logging.level.root=WARN
logging.level.com.shoply=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Payment provider
shoply.payment.provider=${PAYMENT_PROVIDER:stripe}

# CORS — production frontend origin
shoply.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Upload directory
shoply.upload.dir=${UPLOAD_DIR:/var/shoply/uploads}

# Cookie security (HTTPS in prod)
shoply.cookie.secure=true

# Server
server.port=${SERVER_PORT:8080}
