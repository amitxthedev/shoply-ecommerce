# Local development overrides
# Activated by spring.profiles.default=local

# Cookie security (HTTP in dev)
shoply.cookie.secure=false

# Payment provider (mock for dev)
shoply.payment.provider=mock

# CORS allowed origins
shoply.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Upload directory
shoply.upload.dir=./uploads

